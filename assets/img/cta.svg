<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <!-- Soft gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2eee2"/>
      <stop offset="100%" stop-color="#e8dec5"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1.5" fill="#35654d" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  
  <!-- Centered content -->
  <g transform="translate(600,450)">
    <!-- Oak tree icon (simplified) -->
    <g transform="translate(0,-150)" opacity="0.4">
      <path d="M -75 50 Q -50 -37, 0 -75 Q 50 -37, 75 50 Z"
        fill="#35654d" opacity="0.6"/>
      <rect x="-4" y="37" width="8" height="37" fill="#26473a"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="0" text-anchor="middle" 
      font-family="Georgia, serif" font-size="45" fill="#26473a" 
      font-weight="500" letter-spacing="0.15em">CTA</text>
    
    <!-- Separator -->
    <line x1="-30" y1="42" x2="30" y2="42" 
      stroke="#d4af37" stroke-width="2" opacity="0.5"/>
    
    <!-- Description -->
    <text x="0" y="105" text-anchor="middle" 
      font-family="system-ui, sans-serif" font-size="20" fill="#26473a" 
      opacity="0.65">Coffee mug on sunlit windowsill with small vase of greenery</text>
    
    <!-- Dimensions -->
    <text x="0" y="135" text-anchor="middle" 
      font-family="monospace" font-size="18" fill="#26473a" 
      opacity="0.4">1200 × 900</text>
  </g>
  
  <!-- Corner marker -->
  <text x="20" y="880" font-family="monospace" font-size="12" fill="#26473a" opacity="0.4">PLACEHOLDER</text>
</svg>