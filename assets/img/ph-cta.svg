<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4e9d8"/>
      <stop offset="70%" stop-color="#e8d5b7"/>
      <stop offset="100%" stop-color="#c9a888"/>
    </linearGradient>
    <linearGradient id="csill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a888"/>
      <stop offset="100%" stop-color="#8a6b4c"/>
    </linearGradient>
    <radialGradient id="csun" cx="55%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#f4e9d8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f4e9d8" stop-opacity="0"/>
    </radialGradient>
    <!-- Vertical sheer curtain streaks -->
    <pattern id="ccurtain" x="0" y="0" width="40" height="100" patternUnits="userSpaceOnUse">
      <line x1="20" y1="0" x2="20" y2="100" stroke="#f4e9d8" stroke-width="3" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#e8d5b7" stroke-width="1" opacity="0.15"/>
    </pattern>
    <filter id="cgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.06 0"/>
    </filter>
  </defs>
  
  <rect width="1200" height="585.0" fill="url(#cbg)"/>
  <rect width="1200" height="585.0" fill="url(#ccurtain)"/>
  <rect width="1200" height="585.0" fill="url(#csun)"/>
  
  <!-- Windowsill (wooden ledge) -->
  <rect x="0" y="585.0" width="1200" height="54.0" fill="url(#csill)"/>
  <rect x="0" y="639.0" width="1200" height="261.0" fill="#8a6b4c" opacity="0.45"/>
  <!-- Sill edge highlight -->
  <line x1="0" y1="585.0" x2="1200" y2="585.0" stroke="#f4e9d8" stroke-width="2" opacity="0.5"/>
  
  <!-- Ceramic coffee mug (center-left) -->
  <g opacity="0.9">
    <ellipse cx="360.0" cy="450.0" rx="78.0" ry="16.2" fill="#2a1f15" opacity="0.3"/>
    <path d="M 282.0 450.0 L 282.0 567.0 Q 282.0 594.0, 318.0 594.0 
             L 402.0 594.0 Q 438.0 594.0, 438.0 567.0 L 438.0 450.0 Z"
          fill="#f4e9d8" opacity="0.95"/>
    <ellipse cx="360.0" cy="450.0" rx="78.0" ry="16.2" fill="#2a1f15" opacity="0.5"/>
    <ellipse cx="360.0" cy="450.0" rx="66.0" ry="12.6" fill="#8a6b4c" opacity="0.65"/>
    <!-- Handle -->
    <path d="M 438.0 495.00000000000006 Q 480.0 495.00000000000006, 480.0 540.0 Q 480.0 567.0, 438.0 567.0" 
          stroke="#f4e9d8" stroke-width="5" fill="none" opacity="0.9"/>
  </g>
  
  <!-- Small vase with eucalyptus-like sprigs (right of mug) -->
  <g opacity="0.85">
    <ellipse cx="624.0" cy="585.0" rx="42.00000000000001" ry="10.8" fill="#2a1f15" opacity="0.3"/>
    <rect x="594.0" y="495.00000000000006" width="60.0" height="90.0" fill="#f4e9d8" opacity="0.9" rx="3"/>
    <!-- Sprigs -->
    <path d="M 624.0 495.00000000000006 Q 618.0 405.0, 612.0 270.0" stroke="#3f5a3f" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 624.0 495.00000000000006 Q 636.0 405.0, 660.0 270.0" stroke="#3f5a3f" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 624.0 495.00000000000006 Q 600.0 423.0, 576.0 315.0" stroke="#3f5a3f" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Small leaves on sprigs -->
    <ellipse cx="614.4" cy="378.0" rx="4" ry="7" fill="#5a7556" opacity="0.85" transform="rotate(-15 614.4 378.0)"/>
    <ellipse cx="606.0" cy="315.0" rx="4" ry="7" fill="#5a7556" opacity="0.85" transform="rotate(-20 606.0 315.0)"/>
    <ellipse cx="642.0" cy="360.0" rx="4" ry="7" fill="#5a7556" opacity="0.85" transform="rotate(15 642.0 360.0)"/>
    <ellipse cx="654.0" cy="297.0" rx="4" ry="7" fill="#5a7556" opacity="0.85" transform="rotate(20 654.0 297.0)"/>
    <ellipse cx="588.0" cy="378.0" rx="4" ry="7" fill="#5a7556" opacity="0.85" transform="rotate(-25 588.0 378.0)"/>
  </g>
  
  <!-- Stack of 2 small books (left of mug) -->
  <g opacity="0.78">
    <rect x="120.0" y="540.0" width="120.0" height="45.0" fill="#8a6b4c" opacity="0.8"/>
    <rect x="126.0" y="504.00000000000006" width="108.0" height="40.5" fill="#3f5a3f" opacity="0.75"/>
  </g>
  
  <!-- Small potted plant (right) -->
  <g opacity="0.75" transform="translate(936.0,522.0)">
    <rect x="-25" y="40" width="50" height="55" fill="#8a6b4c" opacity="0.75" rx="4"/>
    <path d="M 0 40 Q -15 -5, -30 -45 Q -40 -75, -35 -95" stroke="#3f5a3f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 0 40 Q 0 -10, 5 -60 Q 10 -100, 20 -120" stroke="#3f5a3f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 0 40 Q 20 0, 35 -30 Q 50 -55, 55 -75" stroke="#3f5a3f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 0 40 Q -25 10, -40 -10 Q -55 -30, -55 -45" stroke="#3f5a3f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <rect width="1200" height="900" filter="url(#cgrain)" opacity="0.4"/>
</svg>