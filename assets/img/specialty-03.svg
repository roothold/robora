<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice">
  <!-- Soft gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2eee2"/>
      <stop offset="100%" stop-color="#e8dec5"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1.5" fill="#35654d" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <rect width="900" height="700" fill="url(#dots)"/>
  
  <!-- Centered content -->
  <g transform="translate(450,350)">
    <!-- Oak tree icon (simplified) -->
    <g transform="translate(0,-123)" opacity="0.4">
      <path d="M -58 38 Q -38 -29, 0 -58 Q 38 -29, 58 38 Z"
        fill="#35654d" opacity="0.6"/>
      <rect x="-4" y="29" width="8" height="29" fill="#26473a"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="0" text-anchor="middle" 
      font-family="Georgia, serif" font-size="35" fill="#26473a" 
      font-weight="500" letter-spacing="0.15em">FAMILY SUPPORT</text>
    
    <!-- Separator -->
    <line x1="-30" y1="37" x2="30" y2="37" 
      stroke="#d4af37" stroke-width="2" opacity="0.5"/>
    
    <!-- Description -->
    <text x="0" y="95" text-anchor="middle" 
      font-family="system-ui, sans-serif" font-size="15" fill="#26473a" 
      opacity="0.65">Mother + child, warm embrace</text>
    
    <!-- Dimensions -->
    <text x="0" y="125" text-anchor="middle" 
      font-family="monospace" font-size="13" fill="#26473a" 
      opacity="0.4">900 × 700</text>
  </g>
  
  <!-- Corner marker -->
  <text x="20" y="680" font-family="monospace" font-size="12" fill="#26473a" opacity="0.4">PLACEHOLDER</text>
</svg>