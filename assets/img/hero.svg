<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Soft gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2eee2"/>
      <stop offset="100%" stop-color="#e8dec5"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1.5" fill="#35654d" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  
  <!-- Centered content -->
  <g transform="translate(800,600)">
    <!-- Oak tree icon (simplified) -->
    <g transform="translate(0,-190)" opacity="0.4">
      <path d="M -100 66 Q -66 -50, 0 -100 Q 66 -50, 100 66 Z"
        fill="#35654d" opacity="0.6"/>
      <rect x="-4" y="50" width="8" height="50" fill="#26473a"/>
    </g>
    
    <!-- Label -->
    <text x="0" y="0" text-anchor="middle" 
      font-family="Georgia, serif" font-size="60" fill="#26473a" 
      font-weight="500" letter-spacing="0.15em">HERO</text>
    
    <!-- Separator -->
    <line x1="-30" y1="50" x2="30" y2="50" 
      stroke="#d4af37" stroke-width="2" opacity="0.5"/>
    
    <!-- Description -->
    <text x="0" y="120" text-anchor="middle" 
      font-family="system-ui, sans-serif" font-size="27" fill="#26473a" 
      opacity="0.65">Warm therapy room — armchair, side table, plants, window light</text>
    
    <!-- Dimensions -->
    <text x="0" y="150" text-anchor="middle" 
      font-family="monospace" font-size="25" fill="#26473a" 
      opacity="0.4">1600 × 1200</text>
  </g>
  
  <!-- Corner marker -->
  <text x="20" y="1180" font-family="monospace" font-size="12" fill="#26473a" opacity="0.4">PLACEHOLDER</text>
</svg>